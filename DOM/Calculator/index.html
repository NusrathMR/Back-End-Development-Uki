<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Css.css">
</head>
<body>
    <div class="Appborder">
        <div class="divider">
            <div><button>1</button></div>
            <div><button>2</button></div>
            <div><button>3</button></div>
        </div>

        <div class="divider">
            <div><button>4</button></div>
            <div><button>5</button></div>
            <div><button>6</button></div>
        </div>

        <div class="divider">
            <div><button>7</button></div>
            <div><button>8</button></div>
            <div><button>9</button></div>
        </div>

        <div class="divider">
            <div><button>0</button></div>
            <div><button>+</button></div>
            <div><button>-</button></div>
        </div>

        <div class="divider">
            <div><button>*</button></div>
            <div><button>/</button></div>
            <div><button style="background-color: blue; color: white;">=</button></div>
        </div>
    </div>
</body>
</html>
