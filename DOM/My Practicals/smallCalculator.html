<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        div{
            background-color: green;
            width: 100px;
            height: 100px;
        }

        .blueBox{
            background-color: blue;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <input type="number" placeholder="First Number" id="num1"> 
    <input type="number" placeholder="Second Number" id="num2">
    <button onclick="sum()">Add</button>

    <h1 id="output"></h1>

    <div id="greenBox"></div> <br>
    <button onclick="change()">Change color</button>

    <script>
        const num1 = document.getElementById("num1");
        const num2 = document.getElementById("num2");
        const output = document.getElementById("output");
        const greenBox = document.getElementById("greenBox");
        

        

        function sum(){
            
            const box1value = Number(num1.value);
            const box2value = Number(num2.value);

            const total = box1value+box2value;
            output.textContent = total;
        }

        function change(){
            greenBox.setAttribute("class", "blueBox");
        }

        

    </script>
</body>
</html>
