<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rating App</title>
</head>
<body>
    <form id="form">
        Movie Name: <input type="text" placeholder="Movie Name" id="movie"> <br><br>
        Director: <input type="text" placeholer="Director" id="director"> <br><br>
        Release Year: <input type="number" placeholder="year" id="year"> <br><br>
        Rating: <input type="number" placeholder="Rating" id="rating"> <br><br>

        <button type="submit" id="movieDetails">SUBMIT</button>
    </form>

    <div id="movieDetails"></div>
</body>
</html>
