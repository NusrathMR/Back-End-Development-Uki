<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Managment System</title>
</head>
<body>
    <form id="studentform">
        Name: <input type="text" placeholder="Student Name" id="name"> <br>
        Age: <input type="number" placeholder="Age" id="age"> <br>
        Email: <input type="email" placeholder="Email" id="email"> <br>
        Course: <input type="text" placeholder="Course" id="course"> <br>

        <button type="submit">Add students</button>
    </form>

    <h1>Students List</h1>

    <div id="studentsList"></div>
</body>
</html>
